<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111724" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Institutional Obsidian Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#243045" stroke-width="2" />

  <!-- Subtle Horizontal Baseline Grid -->
  <line x1="10" y1="46" x2="54" y2="46" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Candle 1: Bearish Retracement / Pullback -->
  <line x1="17" y1="24" x2="17" y2="48" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
  <rect x="13" y="29" width="8" height="13" rx="2" fill="#EF4444" />

  <!-- Candle 2: Bullish Gold Breakout (XAU Focal Candle) -->
  <line x1="32" y1="15" x2="32" y2="44" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  <rect x="28" y="20" width="8" height="17" rx="2" fill="url(#gold)" />

  <!-- Candle 3: Bullish Continuation Expansion -->
  <line x1="47" y1="10" x2="47" y2="35" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  <rect x="43" y="14" width="8" height="15" rx="2" fill="url(#bull)" />
</svg>
